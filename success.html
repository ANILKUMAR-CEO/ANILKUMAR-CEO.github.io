<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Successful</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5fff5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
text-align:center;
max-width:400px;
width:90%;
}

.tick{
font-size:80px;
color:green;
animation:pop .6s ease;
}

@keyframes pop{
0%{transform:scale(0);}
80%{transform:scale(1.2);}
100%{transform:scale(1);}
}

h1{
color:#0B6623;
margin-top:10px;
}

p{
color:#555;
line-height:1.6;
}

button{
margin-top:20px;
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#0B6623;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}
</style>

</head>
<body>

<div class="box">

<div class="tick">✅</div>

<h1>Order Placed Successfully!</h1>

<p>
Thank you for shopping with<br>
<b>ANIL KUMAR DAIRY FARMS</b>
</p>

<button onclick="location.href='index.html'">
Continue Shopping
</button>
</div>

</body>
</html>
