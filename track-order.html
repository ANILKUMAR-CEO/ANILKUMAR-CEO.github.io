<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Track Order | ANIL KUMAR DAIRY FARMS
</title>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    font-family:
        Arial,
        sans-serif;

    background:#f5fff5;

    color:#222;

    padding:20px;

}


.container{

    max-width:650px;

    margin:auto;

}


.header{

    background:#0B6623;

    color:white;

    padding:20px;

    border-radius:15px;

    text-align:center;

}


.header h1{

    margin:0;

    font-size:25px;

}


.header p{

    margin:8px 0 0;

}


.search-box{

    background:white;

    margin-top:20px;

    padding:20px;

    border-radius:15px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.10);

}


.search-box input{

    width:100%;

    padding:13px;

    border:1px solid #ccc;

    border-radius:9px;

    font-size:15px;

}


.search-box button{

    width:100%;

    margin-top:12px;

    padding:13px;

    border:none;

    border-radius:9px;

    background:#0B6623;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

}


.loading{

    text-align:center;

    padding:25px;

    color:#777;

}


.error{

    background:#ffeaea;

    color:#b00000;

    padding:15px;

    border-radius:10px;

    margin-top:20px;

}


.order-card{

    background:white;

    margin-top:20px;

    padding:20px;

    border-radius:15px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.10);

}


.order-card h2{

    color:#0B6623;

    margin-top:0;

}


.info{

    margin-top:12px;

    line-height:1.6;

}


.products{

    border-top:1px solid #ddd;

    margin-top:15px;

    padding-top:15px;

}


.product{

    padding:10px 0;

    border-bottom:1px solid #eee;

}


.total{

    font-size:20px;

    font-weight:bold;

    color:#0B6623;

    margin-top:15px;

}


/* =========================================
   STATUS TRACKER
========================================= */


.status-title{

    color:#0B6623;

    margin-top:25px;

}


.status-tracker{

    margin-top:20px;

}


.status-step{

    display:flex;

    align-items:center;

    margin-bottom:18px;

}


.status-icon{

    width:38px;

    height:38px;

    border-radius:50%;

    background:#ddd;

    display:flex;

    align-items:center;

    justify-content:center;

    font-weight:bold;

    margin-right:12px;

}


.status-step.active
.status-icon{

    background:#0B6623;

    color:white;

}


.status-step.completed
.status-icon{

    background:#0B6623;

    color:white;

}


.status-text{

    font-size:15px;

}


.status-text strong{

    display:block;

}


.current-status{

    margin-top:20px;

    padding:15px;

    background:#fff3cd;

    color:#856404;

    border-radius:10px;

    font-weight:bold;

    text-align:center;

}


.back-button{

    margin-top:20px;

    width:100%;

    padding:13px;

    border:none;

    border-radius:9px;

    background:#555;

    color:white;

    font-size:16px;

    cursor:pointer;

}


</style>

</head>


<body>


<div class="container">


    <div class="header">

        <h1>
            📦 Track Your Order
        </h1>

        <p>
            ANIL KUMAR DAIRY FARMS
        </p>

    </div>


    <div class="search-box">

        <input
            type="text"
            id="orderIdInput"
            placeholder="Enter Order ID"
        >


        <button
            onclick="loadOrder()"
        >

            🔍 Track Order

        </button>

    </div>


    <div
        id="result"
    ></div>


    <button
        class="back-button"
        onclick="location.href='index.html'"
    >

        🏠 Back to Home

    </button>


</div>


<script type="module">


/* =========================================
   FIREBASE
========================================= */


import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getFirestore,
    doc,
    onSnapshot
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */


const firebaseConfig = {

    apiKey:
    "AIzaSyDSythwm5e2Q96rDBu4JDdUItAN6nXWW3Q",

    authDomain:
    "anil-kumar-dairy-farms.firebaseapp.com",

    projectId:
    "anil-kumar-dairy-farms",

    storageBucket:
    "anil-kumar-dairy-farms.firebasestorage.app",

    messagingSenderId:
    "698324008132",

    appId:
    "1:698324008132:web:aaf2b196d4f21c30c91d91",

    measurementId:
    "G-42C7RVB715"

};


const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(
        app
    );


/* =========================================
   ELEMENTS
========================================= */


const result =
    document.getElementById(
        "result"
    );


const orderIdInput =
    document.getElementById(
        "orderIdInput"
    );


/* =========================================
   STATUS LIST
========================================= */


const statuses = [

    "Pending",

    "Confirmed",

    "Preparing",

    "Out for Delivery",

    "Delivered"

];


const statusIcons = [

    "🕐",

    "✅",

    "👨‍🍳",

    "🚚",

    "🎉"

];


/* =========================================
   GET ORDER ID FROM URL
========================================= */


const params =
    new URLSearchParams(
        window.location.search
    );


const urlOrderId =
    params.get(
        "orderId"
    );


if(urlOrderId){

    orderIdInput.value =
        urlOrderId;

    loadOrder();

}


/* =========================================
   LOAD ORDER
========================================= */


window.loadOrder =
function(){

    const orderId =
        orderIdInput
        .value
        .trim();


    if(!orderId){

        result.innerHTML = `

            <div class="error">

                ❌ Please enter your Order ID.

            </div>

        `;

        return;

    }


    result.innerHTML = `

        <div class="loading">

            🔄 Loading order...

        </div>

    `;


    const orderRef =
        doc(
            db,
            "orders",
            orderId
        );


    /* =====================================
       REAL-TIME LISTENER
    ===================================== */


    onSnapshot(

        orderRef,

        snapshot=>{

            if(
                !snapshot.exists()
            ){

                result.innerHTML = `

                    <div class="error">

                        ❌ Order not found.

                        <br><br>

                        Please check your Order ID.

                    </div>

                `;

                return;

            }


            const order =
                snapshot.data();


            displayOrder(
                orderId,
                order
            );

        },


        error=>{

            console.error(
                "Order tracking error:",
                error
            );


            result.innerHTML = `

                <div class="error">

                    ❌ Unable to load order.

                    <br><br>

                    Please try again.

                </div>

            `;

        }

    );

};


/* =========================================
   DISPLAY ORDER
========================================= */


function displayOrder(
    orderId,
    order
){

    const orderItems =
        Array.isArray(order.items)
            ? order.items
            : Array.isArray(order.products)
                ? order.products
                : [];


    let productsHTML =
        "";


    orderItems.forEach(
        item=>{

            const qty =
                Number(item.qty) || 0;


            const price =
                Number(item.price) || 0;


            const subtotal =
                Number(item.subtotal) ||
                qty * price;


            productsHTML += `

                <div class="product">

                    🥛

                    <b>
                        ${escapeHTML(
                            item.name ||
                            "Product"
                        )}
                    </b>

                    × ${qty}

                    =

                    ₹${subtotal}

                </div>

            `;

        }
    );


    const status =
        order.status ||
        "Pending";


    let currentIndex =
        statuses.indexOf(
            status
        );


    if(currentIndex === -1){

        currentIndex = 0;

    }


    let statusHTML =
        "";


    statuses.forEach(
        (item,index)=>{

            let className = "";


            if(index <= currentIndex){

                className =
                    index === currentIndex
                        ? "active"
                        : "completed";

            }


            statusHTML += `

                <div
                    class="status-step ${className}"
                >

                    <div
                        class="status-icon"
                    >

                        ${statusIcons[index]}

                    </div>


                    <div
                        class="status-text"
                    >

                        <strong>
                            ${item}
                        </strong>

                    </div>

                </div>

            `;

        }
    );


    result.innerHTML = `

        <div class="order-card">


            <h2>
                📦 Order Details
            </h2>


            <div class="info">

                🆔

                <b>
                    Order ID:
                </b>

                ${escapeHTML(
                    orderId
                )}

            </div>


            <div class="info">

                👤

                <b>
                    Customer:
                </b>

                ${escapeHTML(
                    order.name ||
                    "Customer"
                )}

            </div>


            <div class="info">

                💳

                <b>
                    Payment:
                </b>

                ${escapeHTML(
                    order.payment ||
                    "Not specified"
                )}

            </div>


            <div class="products">

                <h3>
                    🛒 Products
                </h3>

                ${
                    productsHTML ||
                    "<p>No product details.</p>"
                }

            </div>


            <div class="total">

                💰 Total:

                ₹${Number(
                    order.total
                ) || 0}

            </div>


            <h3
                class="status-title"
            >

                🚚 Order Progress

            </h3>


            <div
                class="status-tracker"
            >

                ${statusHTML}

            </div>


            <div
                class="current-status"
            >

                Current Status:

                ${escapeHTML(
                    status
                )}

            </div>


        </div>

    `;

}


/* =========================================
   ESCAPE HTML
========================================= */


function escapeHTML(
    value
){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


</script>


</body>

</html>
