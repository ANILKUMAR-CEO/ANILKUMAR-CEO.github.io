<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Customer Login | ANIL KUMAR DAIRY FARMS</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f5fff5;
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 35px rgba(0,0,0,.15);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:80px;
    height:80px;
    object-fit:contain;
}

h1{
    text-align:center;
    color:#0B6623;
    margin:5px 0;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#0B6623;
    box-shadow:0 0 0 2px rgba(11,102,35,.08);
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background:#0B6623;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#888;
    cursor:not-allowed;
}

.error{
    margin-top:15px;
    text-align:center;
    color:#c00000;
    font-weight:bold;
}

.success{
    margin-top:15px;
    text-align:center;
    color:#0B6623;
    font-weight:bold;
}

.links{
    margin-top:20px;
    text-align:center;
}

.links a{
    color:#0B6623;
    text-decoration:none;
    font-weight:bold;
}

.links p{
    color:#666;
}

.back{
    display:block;
    margin-top:20px;
    text-align:center;
    color:#555;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo">

        <img
            src="images/logo.png"
            alt="ANIL KUMAR DAIRY FARMS"
        >

    </div>

    <h1>
        Customer Login
    </h1>

    <p class="subtitle">
        ANIL KUMAR DAIRY FARMS
    </p>

    <input
        type="email"
        id="email"
        placeholder="Email Address"
        autocomplete="email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
    >

    <button
        id="loginBtn"
        onclick="loginUser()"
    >
        🔐 Login
    </button>

    <div
        id="message"
        class="error"
    ></div>

    <div class="links">

        <p>
            Don't have an account?
            <a href="signup.html">
                Create Account
            </a>
        </p>

    </div>

    <a
        href="index.html"
        class="back"
    >
        ← Back to Website
    </a>

</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyDSythwm5e2Q96rDBu4JDdUItAN6nXWW3Q",

    authDomain:
    "anil-kumar-dairy-farms.firebaseapp.com",

    projectId:
    "anil-kumar-dairy-farms",

    storageBucket:
    "anil-kumar-dairy-farms.firebasestorage.app",

    messagingSenderId:
    "698324008132",

    appId:
    "1:698324008132:web:aaf2b196d4f21c30c91d91",

    measurementId:
    "G-42C7RVB715"

};


const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


window.loginUser =
async function(){

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    const message =
        document
        .getElementById("message");

    const button =
        document
        .getElementById("loginBtn");


    message.innerText =
        "";

    message.className =
        "error";


    if(!email || !password){

        message.innerText =
            "❌ Please enter email and password.";

        return;

    }


    button.disabled =
        true;

    button.innerText =
        "Logging in...";


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        message.className =
            "success";

        message.innerText =
            "✅ Login successful. Redirecting...";


        setTimeout(()=>{

            window.location.href =
                "index.html";

        },800);


    }

    catch(error){

        console.error(
            "Login error:",
            error
        );


        if(
            error.code ===
            "auth/invalid-credential"
        ){

            message.innerText =
                "❌ Invalid email or password.";

        }

        else if(
            error.code ===
            "auth/too-many-requests"
        ){

            message.innerText =
                "❌ Too many attempts. Please try again later.";

        }

        else{

            message.innerText =
                "❌ Login failed. Please try again.";

        }


        button.disabled =
            false;

        button.innerText =
            "🔐 Login";

    }

};

</script>

</body>

</html>
