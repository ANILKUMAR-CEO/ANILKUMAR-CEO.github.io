<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Checkout | ANIL KUMAR DAIRY FARMS</title>


<style>

body{
    font-family:Arial,sans-serif;
    background:#f5fff5;
    margin:0;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#0B6623;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    background:#0B6623;
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#084d19;
}

button:disabled{
    background:#888;
    cursor:not-allowed;
}

#orderSummary{
    background:#f8f8f8;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
}

.product-row{
    padding:10px 0;
    border-bottom:1px solid #ddd;
}

#loading{
    display:none;
    text-align:center;
    margin-top:15px;
    color:#0B6623;
    font-weight:bold;
}

#errorBox{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    background:#ffeaea;
    color:#b00000;
    text-align:center;
    font-weight:bold;
}

</style>

</head>


<body>


<div class="container">

<h1>Checkout</h1>


<h3>Order Summary</h3>

<div id="orderSummary"></div>


<h3 style="margin-top:20px;">
Total: ₹<span id="orderTotal">0</span>
</h3>


<input
type="text"
id="name"
placeholder="Full Name"
>


<input
type="tel"
id="phone"
placeholder="Phone Number"
>


<textarea
id="address"
rows="4"
placeholder="Delivery Address"
></textarea>


<select id="payment">

<option value="Cash On Delivery">
Cash On Delivery
</option>

<option value="UPI Payment">
UPI Payment
</option>

</select>


<button
id="placeOrderBtn"
onclick="placeOrder()"
>

Place Order

</button>


<div id="loading">
Saving your order...
</div>


<div id="errorBox"></div>


</div>


<!-- ================= FIREBASE ================= -->

<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {
    getAuth
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* ==================================================
   FIREBASE CONFIG
================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyDSythwm5e2Q96rDBu4JDdUItAN6nXWW3Q",

    authDomain:
    "anil-kumar-dairy-farms.firebaseapp.com",

    projectId:
    "anil-kumar-dairy-farms",

    storageBucket:
    "anil-kumar-dairy-farms.firebasestorage.app",

    messagingSenderId:
    "698324008132",

    appId:
    "1:698324008132:web:aaf2b196d4f21c30c91d91",

    measurementId:
    "G-42C7RVB715"

};


/* ==================================================
   INITIALIZE FIREBASE
================================================== */

const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(app);


const auth =
    getAuth(app);


/* ==================================================
   ELEMENTS
================================================== */

const orderSummary =
    document.getElementById(
        "orderSummary"
    );


const orderTotal =
    document.getElementById(
        "orderTotal"
    );


const button =
    document.getElementById(
        "placeOrderBtn"
    );


const loading =
    document.getElementById(
        "loading"
    );


const errorBox =
    document.getElementById(
        "errorBox"
    );


/* ==================================================
   DISPLAY CART
================================================== */

const cart =
    JSON.parse(
        localStorage.getItem("cart")
    ) || [];


let total = 0;


if(cart.length === 0){

    orderSummary.innerHTML = `
        <p>Your cart is empty.</p>
    `;

}
else{

    cart.forEach(item => {

        const price =
            Number(item.price) || 0;

        const qty =
            Number(item.qty) || 0;

        const subtotal =
            price * qty;

        total += subtotal;


        orderSummary.innerHTML += `

            <div class="product-row">

                <b>
                    ${escapeHTML(item.name)}
                </b>

                <br>

                ₹${price}
                ×
                ${qty}

                =
                ₹${subtotal}

            </div>

        `;

    });

}


orderTotal.innerText =
    total;


/* ==================================================
   PLACE ORDER
================================================== */

window.placeOrder =
async function(){

    errorBox.style.display =
        "none";


    /* ================= GET DETAILS ================= */

    const name =
        document
        .getElementById("name")
        .value
        .trim();


    const phone =
        document
        .getElementById("phone")
        .value
        .trim();


    const address =
        document
        .getElementById("address")
        .value
        .trim();


    const payment =
        document
        .getElementById("payment")
        .value;


    /* ================= VALIDATION ================= */

    if(
        !name ||
        !phone ||
        !address
    ){

        showError(
            "Please fill all delivery details."
        );

        return;

    }


    /* ================= CART CHECK ================= */

    if(
        cart.length === 0
    ){

        showError(
            "Your cart is empty!"
        );

        return;

    }


    /* ==================================================
       IMPORTANT:

       OPEN WHATSAPP WINDOW IMMEDIATELY

       This helps prevent mobile popup blockers.
    ================================================== */

    let whatsappWindow = null;


    try{

        whatsappWindow =
            window.open(
                "",
                "_blank"
            );

    }

    catch(error){

        console.log(
            "WhatsApp window could not open:",
            error
        );

    }


    /* ================= BUTTON ================= */

    button.disabled =
        true;

    button.innerText =
        "Processing...";

    loading.style.display =
        "block";


    /* ==================================================
       BUILD PRODUCTS
    ================================================== */

    const products =
        cart.map(item => {

            const price =
                Number(item.price) || 0;

            const qty =
                Number(item.qty) || 0;


            return {

                name:
                    item.name,

                price:
                    price,

                qty:
                    qty,

                subtotal:
                    price * qty

            };

        });


    /* ==================================================
       GET LOGGED-IN USER

       If customer is logged in,
       save UID and email also.
    ================================================== */

    const currentUser =
        auth.currentUser;


    const userId =
        currentUser
        ? currentUser.uid
        : "";


    const email =
        currentUser
        ? currentUser.email || ""
        : "";


    /* ==================================================
       SAVE ORDER
    ================================================== */

    try{

        const orderRef =
            await addDoc(
                collection(
                    db,
                    "orders"
                ),
                {

                    name:
                        name,

                    phone:
                        phone,

                    address:
                        address,

                    payment:
                        payment,

                    items:
                        products,

                    total:
                        total,

                    status:
                        "Pending",

                    userId:
                        userId,

                    uid:
                        userId,

                    email:
                        email,

                    createdAt:
                        serverTimestamp()

                }
            );


        console.log(
            "Order saved successfully:",
            orderRef.id
        );


        /* ==================================================
           SAVE LAST ORDER ID
        ================================================== */

        localStorage.setItem(
            "lastOrderId",
            orderRef.id
        );


        /* ==================================================
           WHATSAPP MESSAGE
        ================================================== */

        let message =
`🛒 *NEW ORDER*

👤 *Name:* ${name}

📱 *Phone:* ${phone}

🏠 *Address:* ${address}

💳 *Payment:* ${payment}

📦 *PRODUCTS*
`;


        products.forEach(item => {

            message +=
`\n• *${item.name}*
Qty: ${item.qty}
Price: ₹${item.price}
Subtotal: ₹${item.subtotal}
`;

        });


        message +=
`
💰 *TOTAL: ₹${total}*

🆔 *Order ID:*
${orderRef.id}

📦 *Status:* Pending

Please confirm my order.

Thank you!
`;


        const whatsappURL =
            "https://wa.me/919390922530?text=" +
            encodeURIComponent(
                message
            );


        /* ==================================================
           OPEN WHATSAPP
        ================================================== */

        if(
            whatsappWindow &&
            !whatsappWindow.closed
        ){

            whatsappWindow.location.href =
                whatsappURL;

        }

        else{

            /*
             If browser blocked the popup,
             use normal navigation.
            */

            window.location.href =
                whatsappURL;

        }


        /* ==================================================
           CLEAR CART
        ================================================== */

        localStorage.removeItem(
            "cart"
        );


        /* ==================================================
           GO SUCCESS PAGE
        ================================================== */

        setTimeout(
            function(){

                window.location.replace(
                    "success.html"
                );

            },
            1500
        );


    }

    catch(error){

        console.error(
            "Firestore error:",
            error
        );


        /* ================= CLOSE EMPTY WHATSAPP ================= */

        if(
            whatsappWindow &&
            !whatsappWindow.closed
        ){

            try{

                whatsappWindow.close();

            }

            catch(closeError){

                console.log(
                    "Popup close error:",
                    closeError
                );

            }

        }


        button.disabled =
            false;

        button.innerText =
            "Place Order";


        loading.style.display =
            "none";


        showError(
            "Order save failed. Please check your internet connection and try again."
        );

    }

};


/* ==================================================
   ERROR FUNCTION
================================================== */

function showError(message){

    errorBox.innerText =
        "❌ " + message;

    errorBox.style.display =
        "block";

}


/* ==================================================
   HTML ESCAPE
================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}

</script>


</body>

</html>
