<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Admin Dashboard | ANIL KUMAR DAIRY FARMS
</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7f4;
    color:#222;
}

/* ================= LOGIN ================= */

.login-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:400px;
    background:#fff;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 35px rgba(0,0,0,.15);
}

.login-box h1{
    text-align:center;
    color:#0B6623;
    margin-bottom:5px;
}

.login-box p{
    text-align:center;
    color:#777;
}

.login-box input{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

.login-box button{
    width:100%;
    padding:14px;
    margin-top:20px;
    background:#0B6623;
    color:white;
    border:none;
    border-radius:10px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.login-box button:disabled{
    opacity:.6;
}

.error{
    color:red;
    text-align:center;
    margin-top:15px;
}


/* ================= DASHBOARD ================= */

.dashboard{
    display:none;
}


/* ================= HEADER ================= */

.header{
    background:#0B6623;
    color:white;
    padding:18px 20px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h2{
    margin:0;
    font-size:20px;
}

.logout-btn{
    background:white;
    color:#0B6623;
    border:none;
    padding:9px 15px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}


/* ================= CONTENT ================= */

.content{
    padding:20px;
    max-width:1200px;
    margin:auto;
}

.content h1{
    color:#0B6623;
}


/* ================= STAT CARDS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:20px;
}

.stat-card{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.stat-card h3{
    margin:0;
    color:#666;
    font-size:15px;
}

.stat-card h2{
    margin:10px 0 0;
    color:#0B6623;
}


/* ================= ORDERS BOX ================= */

.orders-box{
    background:white;
    margin-top:25px;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.orders-box h2{
    margin-top:0;
    color:#0B6623;
}


/* ================= SEARCH + FILTER ================= */

.order-controls{
    margin-top:18px;
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:12px;
}

.search-input,
.status-filter{

    width:100%;

    padding:13px;

    border:1px solid #ccc;

    border-radius:9px;

    font-size:15px;

    outline:none;

    background:white;
}

.search-input:focus,
.status-filter:focus{

    border-color:#0B6623;

    box-shadow:
        0 0 0 2px
        rgba(11,102,35,.08);
}


/* ================= FILTER INFO ================= */

.filter-info{

    margin-top:12px;

    padding:10px 12px;

    background:#f1fff1;

    color:#0B6623;

    border-radius:8px;

    font-size:14px;

    font-weight:bold;
}


/* ================= BUTTONS ================= */

.refresh-btn{

    background:#0B6623;

    color:white;

    border:none;

    padding:10px 15px;

    border-radius:8px;

    cursor:pointer;

    font-weight:bold;
}

.refresh-btn:active{

    transform:scale(.98);
}


/* ================= ORDER ================= */

.order{

    border:1px solid #ddd;

    border-radius:12px;

    padding:15px;

    margin-top:15px;

    background:white;
}

.order h3{

    margin-top:0;

    color:#0B6623;
}

.order p{

    line-height:1.5;

    word-break:break-word;
}


/* ================= STATUS ================= */

.status{

    display:inline-block;

    background:#fff3cd;

    color:#856404;

    padding:6px 10px;

    border-radius:7px;

    font-size:13px;

    font-weight:bold;
}


/* ================= ORDER BUTTON ================= */

.order button{

    margin-top:10px;

    padding:9px 12px;

    border:none;

    border-radius:7px;

    background:#0B6623;

    color:white;

    cursor:pointer;

    font-weight:bold;
}

.order button:active{

    transform:scale(.98);
}


/* ================= CANCELLED STATUS ================= */

.status-cancelled{

    background:#ffeaea;

    color:#b00000;
}


/* ================= PRODUCT BOX ================= */

.product-item{

    background:#f8fff8;

    padding:10px;

    margin:8px 0;

    border-radius:8px;

    border-left:4px solid #0B6623;
}


/* ================= LOADING ================= */

.loading{

    text-align:center;

    padding:20px;

    color:#777;
}


/* ================= NO RESULTS ================= */

.no-results{

    text-align:center;

    padding:30px 15px;

    color:#777;

    background:#fafafa;

    border-radius:10px;

    margin-top:15px;
}


/* ================= MOBILE ================= */

@media(max-width:800px){

    .stats{

        grid-template-columns:repeat(2,1fr);

    }

    .order-controls{

        grid-template-columns:1fr;

    }

}


@media(max-width:500px){

    .content{

        padding:15px;

    }

    .stats{

        grid-template-columns:1fr 1fr;

        gap:10px;

    }

    .stat-card{

        padding:15px;

    }

    .stat-card h2{

        font-size:22px;

    }

    .header h2{

        font-size:16px;

    }

    .orders-box{

        padding:15px;

    }

    .search-input,
    .status-filter{

        font-size:16px;

        padding:14px;

    }

}

</style>

</head>


<body>


<!-- ==================================================
     LOGIN
================================================== -->

<div
    class="login-page"
    id="loginPage"
>

    <div class="login-box">

        <h1>
            🐄 Admin Login
        </h1>

        <p>
            ANIL KUMAR DAIRY FARMS
        </p>

        <input
            type="email"
            id="adminEmail"
            placeholder="Admin Email"
        >

        <input
            type="password"
            id="adminPassword"
            placeholder="Password"
        >

        <button
            id="loginButton"
            onclick="adminLogin()"
        >
            Login
        </button>

        <div
            class="error"
            id="loginError"
        ></div>

    </div>

</div>


<!-- ==================================================
     DASHBOARD
================================================== -->

<div
    class="dashboard"
    id="dashboard"
>

    <div class="header">

        <h2>
            🐄 ANIL KUMAR DAIRY FARMS
        </h2>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>


    <div class="content">

        <h1>
            Admin Dashboard
        </h1>

        <p>
            Welcome, Admin 👋
        </p>


        <!-- ================= STATISTICS ================= -->

        <div class="stats">

            <div class="stat-card">

                <h3>
                    📦 Total Orders
                </h3>

                <h2 id="totalOrders">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <h3>
                    💰 Total Sales
                </h3>

                <h2>
                    ₹<span id="totalSales">0</span>
                </h2>

            </div>


            <div class="stat-card">

                <h3>
                    👥 Customers
                </h3>

                <h2 id="totalCustomers">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <h3>
                    🛒 Products
                </h3>

                <h2>
                    4
                </h2>

            </div>

        </div>


        <!-- ================= ORDERS ================= -->

        <div class="orders-box">

            <h2>
                📦 Recent Orders
            </h2>


            <button
                class="refresh-btn"
                onclick="loadDashboard()"
            >
                🔄 Refresh Orders
            </button>


            <!-- ================= SEARCH + FILTER ================= -->

            <div class="order-controls">

                <input
                    type="text"
                    id="orderSearch"
                    class="search-input"
                    placeholder="🔎 Search Order ID, Customer or Phone..."
                    oninput="filterOrders()"
                >


                <select
                    id="statusFilter"
                    class="status-filter"
                    onchange="filterOrders()"
                >

                    <option value="All">
                        📦 All Orders
                    </option>

                    <option value="Pending">
                        🕐 Pending
                    </option>

                    <option value="Confirmed">
                        ✅ Confirmed
                    </option>

                    <option value="Preparing">
                        👨‍🍳 Preparing
                    </option>

                    <option value="Out for Delivery">
                        🚚 Out for Delivery
                    </option>

                    <option value="Delivered">
                        🎉 Delivered
                    </option>

                    <option value="Cancelled">
                        ❌ Cancelled
                    </option>

                </select>

            </div>


            <div
                class="filter-info"
                id="filterInfo"
            >
                Showing 0 orders
            </div>


            <div id="ordersList">

                <div class="loading">
                    Loading orders...
                </div>

            </div>

        </div>

    </div>

</div>


<!-- ==================================================
     FIREBASE
================================================== -->

<script type="module">


/* ==================================================
   FIREBASE APP
================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


/* ==================================================
   FIREBASE AUTH
================================================== */

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* ==================================================
   FIRESTORE
================================================== */

import {
    getFirestore,
    collection,
    getDocs,
    query,
    orderBy,
    doc,
    updateDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==================================================
   FIREBASE CONFIG
================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyDSythwm5e2Q96rDBu4JDdUItAN6nXWW3Q",

    authDomain:
    "anil-kumar-dairy-farms.firebaseapp.com",

    projectId:
    "anil-kumar-dairy-farms",

    storageBucket:
    "anil-kumar-dairy-farms.firebasestorage.app",

    messagingSenderId:
    "698324008132",

    appId:
    "1:698324008132:web:aaf2b196d4f21c30c91d91",

    measurementId:
    "G-42C7RVB715"

};


/* ==================================================
   INITIALIZE
================================================== */

const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* ==================================================
   ELEMENTS
================================================== */

const loginPage =
    document.getElementById(
        "loginPage"
    );


const dashboard =
    document.getElementById(
        "dashboard"
    );


const loginError =
    document.getElementById(
        "loginError"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const ordersList =
    document.getElementById(
        "ordersList"
    );


const orderSearch =
    document.getElementById(
        "orderSearch"
    );


const statusFilter =
    document.getElementById(
        "statusFilter"
    );


const filterInfo =
    document.getElementById(
        "filterInfo"
    );


/* ==================================================
   STORE ORDERS
================================================== */

let allOrders = [];


/* ==================================================
   LOGIN
================================================== */

window.adminLogin =
async function(){

    const email =
        document
        .getElementById(
            "adminEmail"
        )
        .value
        .trim();


    const password =
        document
        .getElementById(
            "adminPassword"
        )
        .value;


    loginError.innerText =
        "";


    if(
        !email ||
        !password
    ){

        loginError.innerText =
            "❌ Please enter email and password.";

        return;

    }


    loginButton.disabled =
        true;


    loginButton.innerText =
        "Logging in...";


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }

    catch(error){

        console.error(
            "Firebase Login Error:",
            error
        );


        loginError.innerText =
            "❌ Invalid email or password.";

    }

    finally{

        loginButton.disabled =
            false;


        loginButton.innerText =
            "Login";

    }

};


/* ==================================================
   AUTH STATE
================================================== */

onAuthStateChanged(

    auth,

    async(user)=>{

        if(user){

            loginPage.style.display =
                "none";


            dashboard.style.display =
                "block";


            await loadDashboard();

        }

        else{

            loginPage.style.display =
                "flex";


            dashboard.style.display =
                "none";

        }

    }

);


/* ==================================================
   LOGOUT
================================================== */

window.logout =
async function(){

    try{

        await signOut(
            auth
        );

    }

    catch(error){

        console.error(
            "Logout error:",
            error
        );

    }

};


/* ==================================================
   LOAD DASHBOARD
================================================== */

window.loadDashboard =
async function(){

    ordersList.innerHTML = `

        <div class="loading">

            🔄 Loading orders from Firebase...

        </div>

    `;


    try{

        const ordersRef =
            collection(
                db,
                "orders"
            );


        let snapshot;


        /* ==================================================
           TRY NEWEST FIRST
        ================================================== */

        try{

            const ordersQuery =
                query(
                    ordersRef,
                    orderBy(
                        "createdAt",
                        "desc"
                    )
                );


            snapshot =
                await getDocs(
                    ordersQuery
                );

        }

        catch(error){

            console.log(
                "OrderBy failed, loading normally."
            );


            snapshot =
                await getDocs(
                    ordersRef
                );

        }


        const orders = [];


        snapshot.forEach(
            (document)=>{

                orders.push({

                    id:
                        document.id,

                    ...document.data()

                });

            }
        );


        /* ==================================================
           SORT NEWEST FIRST
        ================================================== */

        orders.sort(
            (a,b)=>{

                const aTime =
                    a.createdAt?.toMillis
                    ? a.createdAt.toMillis()
                    : 0;


                const bTime =
                    b.createdAt?.toMillis
                    ? b.createdAt.toMillis()
                    : 0;


                return bTime - aTime;

            }
        );


        allOrders =
            orders;


        /* ==================================================
           STATISTICS
        ================================================== */

        updateStatistics(
            allOrders
        );


        /* ==================================================
           DISPLAY
        ================================================== */

        filterOrders();

    }

    catch(error){

        console.error(
            "Firestore Error:",
            error
        );


        ordersList.innerHTML = `

            <p style="color:red;">

                ❌ Could not load orders from Firebase.

            </p>

        `;


        filterInfo.innerText =
            "Unable to load orders.";

    }

};


/* ==================================================
   STATISTICS
================================================== */

function updateStatistics(
    orders
){

    document.getElementById(
        "totalOrders"
    ).innerText =
        orders.length;


    let sales =
        0;


    const customers =
        new Set();


    orders.forEach(
        order=>{

            sales +=
                Number(
                    order.total
                ) || 0;


            if(
                order.phone
            ){

                customers.add(
                    String(
                        order.phone
                    )
                );

            }

        }
    );


    document.getElementById(
        "totalSales"
    ).innerText =
        sales;


    document.getElementById(
        "totalCustomers"
    ).innerText =
        customers.size;

}


/* ==================================================
   GET PRODUCTS
================================================== */

function getOrderProducts(
    order
){

    if(
        Array.isArray(
            order.products
        )
    ){

        return order.products;

    }


    if(
        Array.isArray(
            order.items
        )
    ){

        return order.items;

    }


    if(
        Array.isArray(
            order.iteams
        )
    ){

        return order.iteams;

    }


    return [];

}


/* ==================================================
   FILTER ORDERS
================================================== */

window.filterOrders =
function(){

    const searchText =
        orderSearch
        .value
        .trim()
        .toLowerCase();


    const selectedStatus =
        statusFilter.value;


    const filteredOrders =
        allOrders.filter(
            order=>{

                const orderId =
                    String(
                        order.id ||
                        ""
                    )
                    .toLowerCase();


                const customer =
                    String(
                        order.name ||
                        ""
                    )
                    .toLowerCase();


                const phone =
                    String(
                        order.phone ||
                        ""
                    )
                 
                 .toLowerCase();


                const orderStatus =
                    String(
                        order.status ||
                        "Pending"
                    );


                const searchMatch =

                    !searchText ||

                    orderId.includes(
                        searchText
                    ) ||

                    customer.includes(
                        searchText
                    ) ||

                    phone.includes(
                        searchText
                    );


                const statusMatch =

                    selectedStatus ===
                    "All"

                    ||

                    orderStatus ===
                    selectedStatus;


                return (
                    searchMatch &&
                    statusMatch
                );

            }
        );


    displayOrders(
        filteredOrders
    );


    filterInfo.innerText =

        `Showing ${filteredOrders.length} of ${allOrders.length} orders`;

};


/* ==================================================
   DISPLAY ORDERS
================================================== */

function displayOrders(
    orders
){

    if(
        orders.length === 0
    ){

        ordersList.innerHTML = `

            <div class="no-results">

                🔎 No orders found.

                <br><br>

                Try another search or status filter.

            </div>

        `;

        return;

    }


    ordersList.innerHTML =
        "";


    orders.forEach(
        (order,index)=>{

            /* ==================================================
               PRODUCTS
            ================================================== */

            const orderItems =
                getOrderProducts(
                    order
                );


            let productsHTML =
                "";


            if(
                orderItems.length > 0
            ){

                orderItems.forEach(
                    item=>{

                        const qty =
                            Number(
                                item.qty
                            ) || 0;


                        const price =
                            Number(
                                item.price
                            ) || 0;


                        const subtotal =
                            Number(
                                item.subtotal
                            ) ||
                            (
                                qty *
                                price
                            );


                        productsHTML += `

                            <div
                                class="product-item"
                            >

                                🥛

                                <b>
                                    ${
                                        escapeHTML(
                                            item.name ||
                                            "Product"
                                        )
                                    }
                                </b>

                                <br>

                                Quantity:
                                ${qty}

                                <br>

                                Price:
                                ₹${price}

                                <br>

                                <b>
                                    Subtotal:
                                    ₹${subtotal}
                                </b>

                            </div>

                        `;

                    }
                );

            }


            /* ==================================================
               DATE
            ================================================== */

            let orderDate =
                "Date not available";


            if(
                order.createdAt
            ){

                try{

                    if(
                        typeof
                        order.createdAt.toDate
                        ===
                        "function"
                    ){

                        orderDate =
                            order.createdAt
                            .toDate()
                            .toLocaleString(
                                "en-IN"
                            );

                    }

                    else{

                        orderDate =
                            String(
                                order.createdAt
                            );

                    }

                }

                catch(error){

                    console.log(
                        "Date error:",
                        error
                    );

                }

            }


            /* ==================================================
               STATUS
            ================================================== */

            const status =
                order.status ||
                "Pending";


            const statusClass =
                status === "Cancelled"
                ? "status status-cancelled"
                : "status";


            /* ==================================================
               ORDER NUMBER
            ================================================== */

            const orderNumber =
                allOrders.indexOf(
                    order
                ) + 1;


            /* ==================================================
               UPDATE BUTTON
            ================================================== */

            const updateButton =

                status === "Delivered"

                ?

                `
                    <button
                        disabled
                        style="
                            background:#999;
                            cursor:not-allowed;
                        "
                    >
                        ✅ Delivered
                    </button>
                `

                :

                status === "Cancelled"

                ?

                `
                    <button
                        disabled
                        style="
                            background:#999;
                            cursor:not-allowed;
                        "
                    >
                        ❌ Cancelled
                    </button>
                `

                :

                `
                    <button
                        onclick="
                            updateOrderStatus(
                                '${escapeHTML(order.id)}'
                            )
                        "
                    >
                        🔄 Update Status
                    </button>
                `;


            /* ==================================================
               CARD
            ================================================== */

            ordersList.innerHTML += `

                <div class="order">

                    <h3>

                        📦 Order #${orderNumber}

                    </h3>


                    <p>

                        🆔

                        <b>
                            Order ID:
                        </b>

                        ${escapeHTML(
                            order.id
                        )}

                    </p>


                    <p>

                        👤

                        <b>

                            ${escapeHTML(
                                order.name ||
                                "Customer"
                            )}

                        </b>

                    </p>


                    <p>

                        📱

                        ${escapeHTML(
                            order.phone ||
                            ""
                        )}

                    </p>


                    <p>

                        🏠

                        ${escapeHTML(
                            order.address ||
                            ""
                        )}

                    </p>


                    <p>

                        💳

                        <b>
                            Payment:
                        </b>

                        ${escapeHTML(
                            order.payment ||
                            "Not specified"
                        )}

                    </p>


                    <p>

                        🕐

                        <b>
                            Order Date:
                        </b>

                        ${escapeHTML(
                            orderDate
                        )}

                    </p>


                    <hr>


                    <h3>

                        🛒 Products

                    </h3>


                    ${
                        productsHTML ||

                        "<p>No product details.</p>"
                    }


                    <p>

                        💰

                        <b>

                            Total:

                            ₹${
                                Number(
                                    order.total
                                ) || 0
                            }

                        </b>

                    </p>


                    <span
                        class="${statusClass}"
                    >

                        ${escapeHTML(
                            status
                        )}

                    </span>


                    <br>


                    ${updateButton}

                </div>

            `;

        }
    );

}


/* ==================================================
   UPDATE ORDER STATUS
================================================== */

window.updateOrderStatus =
async function(
    orderId
){

    const statuses = [

        "Pending",

        "Confirmed",

        "Preparing",

        "Out for Delivery",

        "Delivered"

    ];


    try{

        const orderRef =
            doc(
                db,
                "orders",
                orderId
            );


        /* ==================================================
           GET CURRENT ORDER
        ================================================== */

        const ordersSnapshot =
            await getDocs(
                collection(
                    db,
                    "orders"
                )
            );


        let currentStatus =
            "Pending";


        ordersSnapshot.forEach(
            document=>{

                if(
                    document.id ===
                    orderId
                ){

                    currentStatus =
                        document
                        .data()
                        .status ||
                        "Pending";

                }

            }
        );


        /* ==================================================
           CANCELLED PROTECTION
        ================================================== */

        if(
            currentStatus ===
            "Cancelled"
        ){

            alert(
                "❌ Cancelled orders cannot be updated."
            );

            return;

        }


        /* ==================================================
           FIND CURRENT STATUS
        ================================================== */

        let currentIndex =
            statuses.indexOf(
                currentStatus
            );


        if(
            currentIndex === -1
        ){

            currentIndex =
                0;

        }


        /* ==================================================
           CHECK DELIVERED
        ================================================== */

        if(
            currentIndex >=
            statuses.length - 1
        ){

            alert(
                "✅ This order is already delivered."
            );

            return;

        }


        /* ==================================================
           NEXT STATUS
        ================================================== */

        currentIndex++;


        const newStatus =
            statuses[
                currentIndex
            ];


        /* ==================================================
           UPDATE FIREBASE
        ================================================== */

        await updateDoc(

            orderRef,

            {

                status:
                    newStatus

            }

        );


        alert(
            "✅ Order status updated to: " +
            newStatus
        );


        /* ==================================================
           REFRESH
        ================================================== */

        await loadDashboard();

    }

    catch(error){

        console.error(
            "Status update error:",
            error
        );


        alert(
            "❌ Could not update order status."
        );

    }

};


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* ==================================================
   FINISHED
================================================== */

console.log(
    "✅ Firebase Admin Dashboard loaded successfully."
);
