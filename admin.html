<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | ANIL KUMAR DAIRY FARMS</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7f4;
    color:#222;
}

/* LOGIN */

.login-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 35px rgba(0,0,0,.15);
}

.login-box h1{
    text-align:center;
    color:#0B6623;
    margin-bottom:5px;
}

.login-box p{
    text-align:center;
    color:#777;
}

.login-box input{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

.login-box button{
    width:100%;
    padding:14px;
    margin-top:20px;
    background:#0B6623;
    color:white;
    border:none;
    border-radius:10px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.login-box button:hover{
    background:#084d19;
}

.error{
    color:red;
    text-align:center;
    margin-top:15px;
}

/* DASHBOARD */

.dashboard{
    display:none;
}

.header{
    background:#0B6623;
    color:white;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h2{
    margin:0;
    font-size:20px;
}

.logout-btn{
    background:white;
    color:#0B6623;
    border:none;
    padding:9px 15px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

/* CONTENT */

.content{
    padding:20px;
    max-width:1200px;
    margin:auto;
}

.content h1{
    color:#0B6623;
}

/* STAT CARDS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:20px;
}

.stat-card{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.stat-card h3{
    margin:0;
    color:#666;
    font-size:15px;
}

.stat-card h2{
    margin:10px 0 0;
    color:#0B6623;
}

/* ORDERS */

.orders-box{
    background:white;
    margin-top:25px;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.orders-box h2{
    margin-top:0;
    color:#0B6623;
}

.order{
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-top:15px;
}

.order h3{
    margin-top:0;
}

.status{
    display:inline-block;
    background:#fff3cd;
    color:#856404;
    padding:6px 10px;
    border-radius:7px;
    font-size:13px;
    font-weight:bold;
}

.order button{
    margin-top:10px;
    padding:9px 12px;
    border:none;
    border-radius:7px;
    background:#0B6623;
    color:white;
    cursor:pointer;
}

/* MOBILE */

@media(max-width:800px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:500px){

    .content{
        padding:15px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .stat-card{
        padding:15px;
    }

    .stat-card h2{
        font-size:22px;
    }

}

</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div class="login-page" id="loginPage">

    <div class="login-box">

        <h1>🐄 Admin Login</h1>

        <p>ANIL KUMAR DAIRY FARMS</p>

        <input
            type="text"
            id="adminUsername"
            placeholder="Admin Username"
        >

        <input
            type="password"
            id="adminPassword"
            placeholder="Password"
        >

        <button onclick="adminLogin()">
            Login
        </button>

        <div class="error" id="loginError"></div>

    </div>

</div>


<!-- ================= DASHBOARD ================= -->

<div class="dashboard" id="dashboard">

    <div class="header">

        <h2>🐄 ANIL KUMAR DAIRY FARMS</h2>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

    </div>


    <div class="content">

        <h1>Admin Dashboard</h1>

        <p>Welcome, Admin 👋</p>


        <!-- STATISTICS -->

        <div class="stats">

            <div class="stat-card">
                <h3>📦 Total Orders</h3>
                <h2 id="totalOrders">0</h2>
            </div>

            <div class="stat-card">
                <h3>💰 Total Sales</h3>
                <h2>₹<span id="totalSales">0</span></h2>
            </div>

            <div class="stat-card">
                <h3>👥 Customers</h3>
                <h2 id="totalCustomers">0</h2>
            </div>

            <div class="stat-card">
                <h3>🛒 Products</h3>
                <h2>4</h2>
            </div>

        </div>


        <!-- ORDERS -->

        <div class="orders-box">

            <h2>📦 Recent Orders</h2>

            <div id="ordersList">

                <p>
                    No orders available yet.
                </p>

            </div>

        </div>

    </div>

</div>


<script>

/* ================= LOGIN ================= */

function adminLogin(){

    const username =
        document.getElementById("adminUsername").value.trim();

    const password =
        document.getElementById("adminPassword").value.trim();

    /*
       TEMPORARY LOGIN

       Username: admin
       Password: 1234
    */

    if(username === "admin" && password === "1234"){

        localStorage.setItem("adminLoggedIn","true");

        showDashboard();

    }else{

        document.getElementById("loginError").innerText =
            "❌ Incorrect username or password.";

    }

}


/* ================= SHOW DASHBOARD ================= */

function showDashboard(){

    document.getElementById("loginPage").style.display="none";

    document.getElementById("dashboard").style.display="block";

    loadDashboard();

}


/* ================= LOGOUT ================= */

function logout(){

    localStorage.removeItem("adminLoggedIn");

    location.reload();

}


/* ================= DASHBOARD DATA ================= */

function loadDashboard(){

    const orders =
        JSON.parse(localStorage.getItem("orders")) || [];

    document.getElementById("totalOrders").innerText =
        orders.length;

    let sales = 0;

    let customers = [];

    orders.forEach(order => {

        sales += Number(order.total) || 0;

        if(order.phone && !customers.includes(order.phone)){
            customers.push(order.phone);
        }

    });

    document.getElementById("totalSales").innerText =
        sales;

    document.getElementById("totalCustomers").innerText =
        customers.length;


    displayOrders(orders);

}


/* ================= DISPLAY ORDERS ================= */

function displayOrders(orders){

    const ordersList =
        document.getElementById("ordersList");

    if(orders.length === 0){

        ordersList.innerHTML =
            "<p>No orders available yet.</p>";

        return;

    }

    ordersList.innerHTML="";

    orders.slice().reverse().forEach((order,index)=>{

        let productsHTML="";

        if(order.items){

            order.items.forEach(item=>{

                productsHTML += `
                    <p>
                    🥛 ${item.name}
                    × ${item.qty}
                    = ₹${item.price * item.qty}
                    </p>
                `;

            });

        }

        ordersList.innerHTML += `

            <div class="order">

                <h3>
                    Order #${orders.length-index}
                </h3>

                <p>
                    👤 <b>${order.name || "Customer"}</b>
                </p>

                <p>
                    📱 ${order.phone || ""}
                </p>

                <p>
                    🏠 ${order.address || ""}
                </p>

                ${productsHTML}

                <p>
                    💰 <b>Total: ₹${order.total || 0}</b>
                </p>

                <span class="status">
                    ${order.status || "New Order"}
                </span>

                <br>

                <button onclick="updateOrderStatus(${orders.length-index-1})">
                    Update Status
                </button>

            </div>

        `;

    });

}


/* ================= UPDATE STATUS ================= */

function updateOrderStatus(index){

    let orders =
        JSON.parse(localStorage.getItem("orders")) || [];

    if(!orders[index]){
        return;
    }

    const statuses = [
        "New Order",
        "Confirmed",
        "Preparing",
        "Out for Delivery",
        "Delivered"
    ];

    let current =
        statuses.indexOf(orders[index].status);

    if(current === -1){
        current = 0;
    }

    current++;

    if(current >= statuses.length){
        current = statuses.length - 1;
    }

    orders[index].status =
        statuses[current];

    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );

    loadDashboard();

}


/* ================= AUTO LOGIN ================= */

if(localStorage.getItem("adminLoggedIn") === "true"){

    showDashboard();

}

</script>

</body>
  </html>
