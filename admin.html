<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Admin Dashboard | ANIL KUMAR DAIRY FARMS
</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7f4;
    color:#222;
}

/* ================= LOGIN ================= */

.login-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:400px;
    background:#fff;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 35px rgba(0,0,0,.15);
}

.login-box h1{
    text-align:center;
    color:#0B6623;
    margin-bottom:5px;
}

.login-box p{
    text-align:center;
    color:#777;
}

.login-box input{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

.login-box button{
    width:100%;
    padding:14px;
    margin-top:20px;
    background:#0B6623;
    color:white;
    border:none;
    border-radius:10px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.login-box button:disabled{
    opacity:.6;
}

.error{
    color:red;
    text-align:center;
    margin-top:15px;
}

/* ================= DASHBOARD ================= */

.dashboard{
    display:none;
}

.header{
    background:#0B6623;
    color:white;
    padding:18px 20px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h2{
    margin:0;
    font-size:20px;
}

.logout-btn{
    background:white;
    color:#0B6623;
    border:none;
    padding:9px 15px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

/* ================= CONTENT ================= */

.content{
    padding:20px;
    max-width:1200px;
    margin:auto;
}

.content h1{
    color:#0B6623;
}

/* ================= STAT CARDS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:20px;
}

.stat-card{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.stat-card h3{
    margin:0;
    color:#666;
    font-size:15px;
}

.stat-card h2{
    margin:10px 0 0;
    color:#0B6623;
}

/* ================= ORDERS ================= */

.orders-box{
    background:white;
    margin-top:25px;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.orders-box h2{
    margin-top:0;
    color:#0B6623;
}

.order{
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-top:15px;
}

.order h3{
    margin-top:0;
    color:#0B6623;
}

.order p{
    line-height:1.5;
}

.status{
    display:inline-block;
    background:#fff3cd;
    color:#856404;
    padding:6px 10px;
    border-radius:7px;
    font-size:13px;
    font-weight:bold;
}

.order button{
    margin-top:10px;
    padding:9px 12px;
    border:none;
    border-radius:7px;
    background:#0B6623;
    color:white;
    cursor:pointer;
}

.refresh-btn{
    background:#0B6623;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

.loading{
    text-align:center;
    padding:20px;
    color:#777;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:500px){

    .content{
        padding:15px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .stat-card{
        padding:15px;
    }

    .stat-card h2{
        font-size:22px;
    }

    .header h2{
        font-size:16px;
    }

}

</style>

</head>


<body>


<!-- ==================================================
     LOGIN
================================================== -->

<div
    class="login-page"
    id="loginPage"
>

    <div class="login-box">

        <h1>
            🐄 Admin Login
        </h1>

        <p>
            ANIL KUMAR DAIRY FARMS
        </p>

        <input
            type="email"
            id="adminEmail"
            placeholder="Admin Email"
        >

        <input
            type="password"
            id="adminPassword"
            placeholder="Password"
        >

        <button
    id="loginButton"
    onclick="adminLogin()">
            
            Login
        </button>

        <div
            class="error"
            id="loginError"
        ></div>

    </div>

</div>


<!-- ==================================================
     DASHBOARD
================================================== -->

<div
    class="dashboard"
    id="dashboard"
>

    <div class="header">

        <h2>
            🐄 ANIL KUMAR DAIRY FARMS
        </h2>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>


    <div class="content">

        <h1>
            Admin Dashboard
        </h1>

        <p>
            Welcome, Admin 👋
        </p>


        <!-- ================= STATISTICS ================= -->

        <div class="stats">

            <div class="stat-card">

                <h3>
                    📦 Total Orders
                </h3>

                <h2 id="totalOrders">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <h3>
                    💰 Total Sales
                </h3>

                <h2>
                    ₹<span id="totalSales">0</span>
                </h2>

            </div>


            <div class="stat-card">

                <h3>
                    👥 Customers
                </h3>

                <h2 id="totalCustomers">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <h3>
                    🛒 Products
                </h3>

                <h2>
                    4
                </h2>

            </div>

        </div>


        <!-- ================= ORDERS ================= -->

        <div class="orders-box">

            <h2>
                📦 Recent Orders
            </h2>

            <button
                class="refresh-btn"
                onclick="loadDashboard()"
            >
                🔄 Refresh Orders
            </button>

            <div id="ordersList">

                <div class="loading">
                    Loading orders...
                </div>

            </div>

        </div>

    </div>

</div>


<!-- ==================================================
     FIREBASE
================================================== -->
